<ion-content [fullscreen]="true">
  <div class="auth-shell">

    <section class="brand">
<div class="brand-logo-container">
  <img
    src="assets/branding/servigo-logo-horizontal.png"
    alt="ServiGo"
    class="brand-logo"
  />
</div>

      <h1>Únete a ServiGo</h1>

      <p>
        Encuentra servicios o comienza tu camino como técnico.
      </p>
    </section>

    <section class="auth-card">

      <form
        [formGroup]="form"
        (ngSubmit)="register()"
      >

        <ion-item lines="none">
          <ion-input
            label="Nombre"
            labelPlacement="stacked"
            formControlName="displayName"
            autocomplete="name"
          ></ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-input
            label="Correo electrónico"
            labelPlacement="stacked"
            type="email"
            formControlName="email"
            autocomplete="email"
          ></ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-input
            label="Contraseña"
            labelPlacement="stacked"
            type="password"
            formControlName="password"
            autocomplete="new-password"
          ></ion-input>
        </ion-item>

        <ion-item lines="none">
          <ion-input
            label="Confirmar contraseña"
            labelPlacement="stacked"
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
          ></ion-input>
        </ion-item>

        <ion-text
          color="danger"
          *ngIf="errorMessage"
        >
          <p class="error">
            {{ errorMessage }}
          </p>
        </ion-text>

        <ion-button
          expand="block"
          type="submit"
          [disabled]="form.invalid || loading"
        >
          <ion-spinner
            *ngIf="loading"
            name="crescent"
          ></ion-spinner>

          <span *ngIf="!loading">
            Crear cuenta
          </span>
        </ion-button>

      </form>

      <div class="secondary-action">
        <span>¿Ya tienes cuenta?</span>

        <ion-button
          fill="clear"
          routerLink="/login"
        >
          Iniciar sesión
        </ion-button>
      </div>

    </section>
  </div>
</ion-content>
